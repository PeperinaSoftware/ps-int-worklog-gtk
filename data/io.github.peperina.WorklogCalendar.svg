<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Worklog Calendar app icon: a white clock face -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7fd6"/>
      <stop offset="1" stop-color="#2f5fb0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#ffffff" stroke-width="7"/>
  <!-- ticks -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="26" x2="64" y2="34"/>
    <line x1="64" y1="94" x2="64" y2="102"/>
    <line x1="26" y1="64" x2="34" y2="64"/>
    <line x1="94" y1="64" x2="102" y2="64"/>
  </g>
  <!-- hands -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="64" y1="64" x2="64" y2="40"/>
    <line x1="64" y1="64" x2="86" y2="72"/>
  </g>
  <circle cx="64" cy="64" r="5" fill="#ffffff"/>
</svg>
